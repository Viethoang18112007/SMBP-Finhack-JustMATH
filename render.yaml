# Render blueprint: one free web service running serve.py (standard library, no build step).
services:
  - type: web
    name: ssust-api
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python serve.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SSUST_MODE
        value: demo
      # The team-only feedback view (/admin/feedback). The value is typed in the Render dashboard,
      # never stored in the repository.
      - key: SSUST_ADMIN_TOKEN
        sync: false
