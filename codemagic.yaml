# Codemagic: build the SSUST iOS shell (Capacitor, Swift Package Manager) and send it to TestFlight.
# The web app and the Python backend need none of this.
# Signing is automatic through the App Store Connect integration SSUST_ASC_KEY (Team settings in
# Codemagic). No key, certificate or profile is stored in this repository.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SSUST_ASC_KEY
    environment:
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adamattar.ssust
      vars:
        # Swift Package Manager project: there is no .xcworkspace, only the .xcodeproj.
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # The app's Apple ID in App Store Connect (App Information > Apple ID). Not a secret.
        APP_STORE_APPLE_ID: 6837791284
    scripts:
      - name: Install the iOS shell dependencies
        script: npm ci
      - name: Copy the web app into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Use the Codemagic build number
        script: |
          # Apple refuses a build number already used. Codemagic's $BUILD_NUMBER starts at 1 again for a
          # new application, so take the larger of it and the latest TestFlight build + 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -cd '0-9')
          LATEST=${LATEST:-0}
          NUMBER=$(( LATEST + 1 > BUILD_NUMBER ? LATEST + 1 : BUILD_NUMBER ))
          echo "Latest TestFlight build: $LATEST, Codemagic build: $BUILD_NUMBER, using: $NUMBER"
          # Info.plist reads CFBundleVersion from CURRENT_PROJECT_VERSION.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NUMBER;/g" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
